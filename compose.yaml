services:
  backend:
    build:
      context: ./
      target: backend-dev
    volumes:
      - ./backend/src:/app/src
    ports:
      - 3000:3000
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./
      target: frontend-dev
    volumes:
      - ./frontend/src:/app/src
    ports:
      - 5173:5173

  mysql:
    image: mysql:lts
    env_file: ".env"
    ports:
      - 3306:3306
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
